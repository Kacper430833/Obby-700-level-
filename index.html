
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULTIMATE OBBY 700</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#65a9ed;color:white}
button{cursor:pointer;font-weight:900;border:3px solid white;border-radius:17px;padding:14px 20px;color:white;background:#168ce9;font-size:clamp(16px,3vw,25px);box-shadow:0 5px 0 #15518b}
button:active{transform:translateY(3px);box-shadow:none}
#menu{position:fixed;inset:0;z-index:5;background:linear-gradient(145deg,#646ed0,#268fca);display:flex;align-items:center;justify-content:space-around;padding:20px}
#menu:before{content:"";position:absolute;inset:0;opacity:.12;background-image:radial-gradient(circle at 20% 20%,white 0 25px,transparent 26px),radial-gradient(circle at 70% 60%,white 0 35px,transparent 36px);background-size:180px 160px}
#left{z-index:1;display:flex;flex-direction:column;gap:18px;width:min(35%,360px)}
#left button{width:100%;text-align:left;font-size:clamp(17px,3.5vw,35px)}
#play{background:#10bc65}
#avatarPreview{width:40%;height:80%;z-index:1;display:flex;align-items:center;justify-content:center}
#avatarPreview img{max-width:100%;max-height:100%;object-fit:contain}
#right{z-index:1;width:19%;display:flex;flex-direction:column;gap:20px}
#right button{font-size:14px;padding:12px}
h1{position:absolute;top:2%;left:50%;transform:translateX(-50%);font-size:clamp(24px,5vw,55px);white-space:nowrap;text-shadow:3px 4px #344b92;z-index:2}
.panel{position:fixed;z-index:8;inset:10%;background:#3269b8;border:4px solid white;border-radius:25px;padding:25px;text-align:center;display:none;overflow:auto}
.panel button{margin:8px}
#hud{display:none;position:fixed;top:12px;left:12px;z-index:3;font-size:19px;font-weight:bold;text-shadow:2px 2px #222;line-height:1.8}
#back{position:fixed;top:12px;right:12px;z-index:4;display:none;font-size:16px}
#mobile{position:fixed;bottom:20px;left:0;right:0;z-index:3;display:none;justify-content:space-between;padding:15px;pointer-events:none}
#mobile button{pointer-events:auto}
#message{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:bold;text-shadow:3px 3px #222;z-index:9;display:none;text-align:center}
@media(max-width:650px){
#menu{justify-content:space-between;padding:8px}
#left{width:37%;gap:12px}
#right{width:22%}
#avatarPreview{width:38%}
#right button{font-size:11px;padding:8px}
}
</style>
</head>
<body>

<div id="menu">
<h1>ULTIMATE OBBY 700</h1>
<div id="left">
<button id="play" onclick="startGame()">▶ PLAY</button>
<button onclick="showPanel('shop')">🛒 SHOP</button>
<button onclick="showPanel('skins')">👕 SKINS</button>
<button onclick="showPanel('language')">🌐 LANGUAGE</button>
</div>
<div id="avatarPreview">
<svg viewBox="0 0 220 350" width="100%" height="100%">
<ellipse cx="110" cy="333" rx="85" ry="12" fill="#333" opacity=".3"/>
<path d="M75 210 L65 310 L100 310 L110 220 L130 310 L160 310 L145 210" fill="#27833e" stroke="#222" stroke-width="5"/>
<path d="M62 300 L100 300 L102 329 L50 329 Q38 319 62 300 M130 300 L164 300 L184 329 L126 329Z" fill="#eee" stroke="#777" stroke-width="4"/>
<path d="M65 125 Q110 105 155 125 L165 220 L55 220Z" fill="#171d26" stroke="#333" stroke-width="5"/>
<path d="M91 127 L130 127 L143 215 L78 215Z" fill="#25c5ce"/>
<path d="M65 137 L40 210 L65 225 L83 164 M155 137 L180 210 L155 225 L137 164" fill="#eee" stroke="#777" stroke-width="5"/>
<rect x="75" y="35" width="75" height="95" rx="25" fill="#f1e9df" stroke="#aaa" stroke-width="4"/>
<path d="M74 80 Q55 20 100 14 Q163 5 160 78 L145 65 L137 35 L95 42 L78 90Z" fill="#bd5a1e"/>
<ellipse cx="97" cy="80" rx="4" ry="12" fill="#171717"/>
<ellipse cx="130" cy="80" rx="4" ry="12" fill="#171717"/>
<path d="M100 104 Q113 120 130 102" stroke="#111" stroke-width="5" fill="none"/>
</svg>
</div>
<div id="right">
<button onclick="alert('Wkrótce: codzienne nagrody!')">TRY NEW GAME<br>+100 🪙</button>
<button onclick="alert('Wkrótce: dodatkowe wyzwania!')">DAILY CHALLENGE</button>
</div>
</div>

<div id="shop" class="panel">
<h2>🛒 SKLEP</h2>
<p>Twoje monety: <span id="shopCoins">0</span> 🪙</p>
<button onclick="buyItem('Wings',150)">🪽 Skrzydła – 150</button>
<button onclick="buyItem('Trail',100)">✨ Trail – 100</button>
<button onclick="buyItem('Pet',250)">🐶 Zwierzak – 250</button>
<button onclick="buyItem('Glow',200)">💫 Glow – 200</button>
<button onclick="closePanels()">WRÓĆ</button>
</div>

<div id="skins" class="panel">
<h2>👕 WYBIERZ SKINA</h2>
<button onclick="changeSkin('#e7b58d')">Classic</button>
<button onclick="changeSkin('#ff65a5')">Pink</button>
<button onclick="changeSkin('#46c9ff')">Blue</button>
<button onclick="changeSkin('#a16aff')">Purple</button>
<button onclick="changeSkin('#55d78b')">Green</button>
<button onclick="closePanels()">WRÓĆ</button>
</div>

<div id="language" class="panel">
<h2>LANGUAGE</h2>
<button onclick="alert('Polski')">🇵🇱 Polski</button>
<button onclick="alert('English')">🇬🇧 English</button>
<button onclick="closePanels()">WRÓĆ</button>
</div>

<div id="hud">LEVEL <span id="level">1</span> / 700<br>🪙 <span id="coins">0</span><br>CHECKPOINT: <span id="checkpoint">1</span></div>
<button id="back" onclick="backToMenu()">MENU</button>
<div id="mobile">
<button id="leftBtn">⬅</button>
<button onclick="jump()">JUMP ⬆</button>
<button id="rightBtn">➡</button>
</div>
<div id="message"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

let scene,camera,renderer,player;
let playing=false,coins=0,level=1,checkpoint=1;
let vy=0,skinColor=0xe7b58d;
let keys={left:false,right:false,forward:false,back:false};
let platforms=[],hazards=[],collected=new Set();
let lastCoin=0;

const $=id=>document.getElementById(id);

function makeMat(color,roughness=.8){
return new THREE.MeshStandardMaterial({color,roughness});
}
function block(w,h,d,color,x,y,z){
let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),makeMat(color));
m.position.set(x,y,z);
m.castShadow=true;m.receiveShadow=true;
scene.add(m);return m;
}

function createAvatar(){
player=new THREE.Group();
let skin=makeMat(skinColor),shirt=makeMat(0x171d26),pants=makeMat(0x26833e);
let hair=makeMat(0xb85b20),shoe=makeMat(0xf1f1f1);
function part(w,h,d,mat,x,y,z){
let mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
mesh.position.set(x,y,z);mesh.castShadow=true;player.add(mesh);return mesh;
}
part(.9,1.1,.5,shirt,0,1.45,0);
part(.43,1,.46,makeMat(0x21c1cb),0,1.45,.04);
part(.95,.35,.5,hair,0,2.05,0);
part(.7,.8,.7,skin,0,2.55,0);
part(.75,.23,.72,hair,0,2.96,0);
part(.16,.3,.7,hair,-.38,2.72,0);
part(.16,.3,.7,hair,.38,2.72,0);
part(.09,.19,.04,makeMat(0x111111),-.17,2.59,.355);
part(.09,.19,.04,makeMat(0x111111),.17,2.59,.355);
part(.22,.05,.04,makeMat(0x111111),0,2.39,.36);
for(let x of [-.25,.25]){
part(.27,.95,.32,skin,x*2,1.5,0);
part(.31,.85,.38,pants,x,0.48,0);
part(.35,.25,.48,shoe,x,.12,.04);
}
scene.add(player);
}

function makeCourse(){
let colors=[0x4289df,0x55b9e8,0x65a6e9,0x8b83db,0x54c8b5];
for(let i=0;i<700;i++){
let z=-i*12;
let color=colors[Math.floor(i/10)%colors.length];
let p=block(9,.6,12,color,0,-.3,z-6);
platforms.push(p);
if(i%4===1){
let h=block(1.4,1.1,1.4,0xff4c65,(i%3-1)*2.4,.55,z-6);
hazards.push(h);
}
if(i%7===3){
block(1.3,.4,1.3,0xffd53b,2.5,.6,z-6);
}
if(i%10===9){
let cp=block(5,.15,1.5,0x35f0a0,0,.15,z-11);
cp.userData.checkpoint=i+1;
}
}
}

function init(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x82caff);
scene.fog=new THREE.Fog(0x82caff,35,120);
camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x68718c,2));
let sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-10,25,15);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);
createAvatar();
makeCourse();
camera.position.set(0,7,12);
camera.lookAt(0,1,0);
}

function startGame(){
if(!renderer)init();
$('menu').style.display='none';
$('hud').style.display='block';
$('back').style.display='block';
$('mobile').style.display='flex';
playing=true;
}
window.startGame=startGame;

function showPanel(name){
$(name).style.display='block';
$('shopCoins').textContent=coins;
}
window.showPanel=showPanel;
function closePanels(){
document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
}
window.closePanels=closePanels;

function buyItem(name,price){
if(coins<price){alert('Nie masz wystarczająco monet!');return;}
coins-=price;
$('coins').textContent=coins;
$('shopCoins').textContent=coins;
alert('Kupiono: '+name+'!');
}
window.buyItem=buyItem;

function changeSkin(color){
skinColor=new THREE.Color(color);
if(player){
player.children.forEach((p,i)=>{
if(i===6||i===7||i===8||i===9||i===10)p.material.color.set(color);
});
}
alert('Skin wybrany!');
}
window.changeSkin=changeSkin;

function jump(){
if(playing && player.position.y<=.12)vy=.24;
}
window.jump=jump;

function backToMenu(){
playing=false;
$('menu').style.display='flex';
$('hud').style.display='none';
$('back').style.display='none';
$('mobile').style.display='none';
closePanels();
}
window.backToMenu=backToMenu;

function bindButton(id,key){
let b=$(id);
b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;});
b.addEventListener('pointerup',()=>keys[key]=false);
b.addEventListener('pointerleave',()=>keys[key]=false);
}
bindButton('leftBtn','left');bindButton('rightBtn','right');

document.addEventListener('keydown',e=>{
if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=true;
if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=true;
if(e.code==='KeyW'||e.code==='ArrowUp')keys.forward=true;
if(e.code==='KeyS'||e.code==='ArrowDown')keys.back=true;
if(e.code==='Space')jump();
});
document.addEventListener('keyup',e=>{
if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=false;
if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=false;
if(e.code==='KeyW'||e.code==='ArrowUp')keys.forward=false;
if(e.code==='KeyS'||e.code==='ArrowDown')keys.back=false;
});

function update(){
if(!playing)return;
let speed=.13;
if(keys.left)player.position.x-=speed;
if(keys.right)player.position.x+=speed;
if(keys.forward)player.position.z-=speed;
if(keys.back)player.position.z+=speed;
player.position.x=THREE.MathUtils.clamp(player.position.x,-4,4);

vy-=.012;
player.position.y+=vy;
if(player.position.y<.12){
player.position.y=.12;vy=0;
}

let nextLevel=Math.min(700,Math.max(1,Math.floor(-player.position.z/12)+1));
if(nextLevel>level){
level=nextLevel;
coins+=10;
}
$('level').textContent=level;
$('coins').textContent=coins;

for(let h of hazards){
if(Math.abs(player.position.z-h.position.z)<.8 &&
Math.abs(player.position.x-h.position.x)<1.2 &&
player.position.y<1.5){
player.position.z=-(checkpoint-1)*12;
player.position.y=.12;
vy=0;
}
}
if(level%10===0)checkpoint=level;
$('checkpoint').textContent=checkpoint;

if(player.position.y< -5){
player.position.z=-(checkpoint-1)*12;
player.position.y=.12;vy=0;
}
if(level>=700){
playing=false;
$('message').style.display='block';
$('message').textContent='🏆 GRATULACJE! UKOŃCZYŁEŚ OBBY 700!';
}
camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+6,player.position.z+10),.09);
camera.lookAt(player.position.x,player.position.y+1,player.position.z-3);
}

function animate(){
requestAnimationFrame(animate);
if(playing)update();
if(renderer)renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
if(!camera)return;
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
